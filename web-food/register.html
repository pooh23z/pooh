<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก - TUNGTUNGTUNGFOOD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .register-container {
      max-width: 1200px;
      width: 100%;
      background: white;
      border-radius: var(--card-radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
    }
    .image-wrapper {
      flex: 1;
      max-width: 50%;
    }
    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .form-section {
      flex: 1;
      max-width: 50%;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    @media (max-width: 992px) {
      .image-wrapper { display: none; }
      .form-section { max-width: 100%; }
    }
  </style>
  <script>
    function handleRegister() {
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      if (firstName && lastName && email) {
        document.getElementById('result').innerHTML =
          `<div class='alert alert-success'>
            คุณ <span class='text-primary fw-bold'>${firstName} ${lastName}</span> ได้สมัครสมาชิกสำเร็จแล้ว<br>
            อีเมล: <span class='fw-bold'>${email}</span>
          </div>`;
      } else {
        document.getElementById('result').innerHTML =
          `<div class='alert alert-danger'>กรุณากรอกข้อมูลให้ครบถ้วน</div>`;
      }
    }
  </script>
</head>
<body>
<div class="register-container">
  <div class="image-wrapper">
    <img src="https://i.imgur.com/n0L3Zeb.png" alt="Food Image">
  </div>

  <div class="form-section">
    <h2 class="text-center mb-4">สมัครสมาชิก TUNGTUNGTUNGFOOD</h2>
    <form onsubmit="event.preventDefault(); handleRegister();">
      <div class="mb-3">
        <label for="firstName" class="form-label">ชื่อ</label>
        <input type="text" class="form-control" id="firstName" placeholder="กรอกชื่อ">
      </div>
      <div class="mb-3">
        <label for="lastName" class="form-label">นามสกุล</label>
        <input type="text" class="form-control" id="lastName" placeholder="กรอกนามสกุล">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">อีเมล</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">รหัสผ่าน</label>
        <input type="password" class="form-control" id="password" placeholder="กรอกรหัสผ่าน">
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">ยืนยันรหัสผ่าน</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="ยืนยันรหัสผ่าน">
      </div>
      <button type="submit" class="btn btn-premium w-100">สมัครสมาชิก</button>
      <p class="text-center mt-3">มีบัญชีแล้ว? <a href="#">เข้าสู่ระบบ</a></p>
    </form>
    <div id="result" class="mt-4"></div>
    <div class="text-center mt-3">
      <a href="index.html" class="btn btn-outline-secondary">กลับหน้าหลัก</a>
    </div>
  </div>
</div>
</body>
</html>
