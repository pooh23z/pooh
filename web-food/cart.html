<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตะกร้าสินค้า - TUNGTUNGTUNGFOOD</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar bg-white shadow-sm py-3 sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
        <span class="text-danger fw-bold fs-4">TUNGTUNGTUNG<span class="text-warning">FOOD</span></span> 
      </a>
      <ul class="nav align-items-center">
        <li class="nav-item">
          <a href="menu.html" class="nav-link fw-bold" >เมนู</a>
        </li>
        <li class="nav-item">
          <a href="reviews.html" class="nav-link text-dark">รีวิวร้านค้า</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-dark" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-globe me-1"></i> Thai
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">English</a></li>
            <li><a class="dropdown-item" href="#">Japan</a></li>
          </ul>
        </li>
        <li class="nav-item mx-3">
          <a href="register.html" class="btn btn-outline-dark btn-sm"><i class="fas fa-user me-1"></i> เข้าสู่ระบบ</a>
        </li>
        <li class="nav-item">
          <a href="cart.html" class="text-decoration-none position-relative">
            <i class="fas fa-shopping-basket fa-lg text-dark"></i>
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">ตะกร้าของคุณ</h2>
    <div id="checkout-result"></div>
    <table class="table table-bordered cart-table">
      <thead class="table-light">
        <tr>
          <th>เลือก</th>
          <th>รูป</th>
          <th>ชื่อเมนู</th>
          <th>จำนวน</th>
          <th>ราคา/หน่วย</th>
          <th>รวม</th>
          <th>ลบ</th>
        </tr>
      </thead>
      <tbody id="cart-items"></tbody>
      <tfoot>
        <tr>
          <th colspan="6" class="text-end">รวมทั้งหมด</th>
          <th id="total-price">฿0</th>
        </tr>
      </tfoot>
    </table>

    <div class="row mb-3">
      <div class="col-md-4">
        <label for="name" class="form-label">ชื่อผู้รับ</label>
        <input type="text" class="form-control" id="name" placeholder="กรอกชื่อของคุณ">
      </div>
      <div class="col-md-4">
        <label for="phone" class="form-label">เบอร์ติดต่อ</label>
        <input type="text" class="form-control" id="phone" placeholder="กรอกเบอร์โทร">
      </div>
      <div class="col-md-4">
        <label for="address" class="form-label">ที่อยู่สำหรับจัดส่ง</label>
        <input type="text" class="form-control" id="address" placeholder="กรอกที่อยู่">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="coupon" class="form-label">กรอกรหัสส่วนลด</label>
        <div class="input-group">
          <input type="text" class="form-control" id="coupon" placeholder="ใส่รหัสส่วนลดที่นี่">
          <button class="btn btn-secondary" type="button" id="apply-coupon">ใช้โค้ด</button>
        </div>
      </div>
    </div>

    <div class="text-end">
      <button class="btn btn-premium" id="checkout-btn" onclick="checkout()">ยืนยันการสั่งซื้อ</button>
      <button class="btn btn-primary d-none" id="loading-btn" type="button" disabled>
        <span class="spinner-grow spinner-grow-sm" aria-hidden="true"></span>
        <span role="status">Loading...</span>
      </button>
    </div>
  </div>

  <script>
    const imageMap = {
      "ชาไทยเย็น": "https://cms.dmpcdn.com/food/2021/05/05/00a9fe30-ad7d-11eb-a73b-c395e0dfc07b_original.jpg",
      "โกโก้เย็น": "https://s359.kapook.com/r/600/auto/pagebuilder/812fd299-6926-463e-ab70-dcbaeba99b30.jpg",
      "ก๋วยเตี๋ยวเรือหมู": "https://img.wongnai.com/p/1920x0/2020/01/20/0e4c6a1ca489437985a9636f29bec582.jpg",
      "ข้าวเหนียวมะม่วง": "https://www.ofm.co.th/blog/wp-content/uploads/2022/04/%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B9%80%E0%B8%AB%E0%B8%99%E0%B8%B5%E0%B8%A2%E0%B8%A7%E0%B8%A1%E0%B8%B0%E0%B8%A1%E0%B9%88%E0%B8%A7%E0%B8%87-1.jpg"
    };

    let cart = [
      { name: "ชาไทยเย็น", price: 30, qty: 1 },
      { name: "โกโก้เย็น", price: 35, qty: 2 },
      { name: "ก๋วยเตี๋ยวเรือหมู", price: 45, qty: 1 },
      { name: "ข้าวเหนียวมะม่วง", price: 50, qty: 1 }
    ];

    function renderCart() {
      const cartItems = document.getElementById('cart-items');
      cartItems.innerHTML = '';

      cart.forEach((item, index) => {
        const imgSrc = imageMap[item.name] || "https://via.placeholder.com/60";
        const itemTotal = item.price * item.qty;
        cartItems.innerHTML += `
          <tr>
            <td><input type="checkbox" class="form-check-input item-check" data-index="${index}" checked></td>
            <td><img  src="${imgSrc}" alt="${item.name}"></td>
            <td>${item.name}</td>
            <td><input type="number" class="form-control quantity" value="${item.qty}" min="1" data-index="${index}"></td>
            <td>฿${item.price}</td>
            <td class="item-total">฿${itemTotal}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button></td>
          </tr>
        `;
      });

      updateTotal();
      document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
    }

    function updateTotal() {
      const checkboxes = document.querySelectorAll('.item-check');
      let total = 0;
      checkboxes.forEach(checkbox => {
        if (checkbox.checked) {
          const index = +checkbox.dataset.index;
          total += cart[index].price * cart[index].qty;
        }
      });
      document.getElementById('total-price').textContent = `฿${total}`;
    }

    function checkout() {
      const selected = document.querySelectorAll('.item-check:checked');
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();

      if (selected.length === 0) return alert("กรุณาเลือกสินค้าที่ต้องการสั่งซื้อ");
      if (!name || !phone || !address) {
        document.getElementById('checkout-result').innerHTML =
          `<div class='alert alert-danger'>กรุณากรอกข้อมูลชื่อ เบอร์โทร และที่อยู่ให้ครบถ้วน</div>`;
        return;
      }

      document.getElementById("checkout-btn").classList.add("d-none");
      document.getElementById("loading-btn").classList.remove("d-none");

      setTimeout(() => {
        document.getElementById('checkout-result').innerHTML =
          `<div class='alert alert-success'>
            คุณ <span class='text-primary fw-bold'>${name}</span> ได้ทำการสั่งซื้อสำเร็จ<br>
            หมายเลขติดต่อ: <span class='fw-bold'>${phone}</span><br>
            ที่อยู่จัดส่ง: ${address}
          </div>`;

        document.getElementById("checkout-btn").classList.remove("d-none");
        document.getElementById("loading-btn").classList.add("d-none");
      }, 1500);
    }

    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderCart();

      document.addEventListener('input', function(e) {
        if (e.target.classList.contains('quantity')) {
          const index = +e.target.dataset.index;
          cart[index].qty = Math.max(1, +e.target.value);
          renderCart();
        }
      });

      document.addEventListener('change', function(e) {
        if (e.target.classList.contains('item-check')) updateTotal();
      });
    });
  
function updateTotal() {
  let total = 0;
  $('.item-check:checked').each(function () {
    const index = $(this).data('index');
    const price = cart[index].price;
    const qty = cart[index].qty;
    total += price * qty;
  });
  $('#total-price').text(`฿${total}`);
}
  
  </script>
</body>
</html>
